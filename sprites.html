<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RUNEGUN — The Vault Studio</title>
  <style>
    :root {
      --void: #05040a;
      --void-2: #0a0814;
      --card-bg: rgba(7, 5, 14, 0.85);
      --line: #1c1a2e;
      --line-dim: #262339;
      --gold: #ffd23d;
      --arcane: #9d6bff;
      --bone: #e8e2d0;
      --dim: #8a84a0;
      --equipped-orange: #ff8a3d;
      --pet-color: #5ee6ff;
      --damage-red: #ff4d5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      background-color: var(--void);
      background-image:
        linear-gradient(rgba(28, 26, 46, 0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(28, 26, 46, 0.35) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--bone);
      font-family: "Courier New", ui-monospace, Menlo, Consolas, monospace;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
    }

    .vault-header {
      width: min(960px, 98vw);
      font-size: 12px;
      letter-spacing: 0.4em;
      color: var(--dim);
      margin-bottom: 10px;
      text-transform: uppercase;
      text-align: center;
    }

    .studio-nav {
      width: min(960px, 98vw);
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .studio-nav .menu-btn {
      flex: 0 1 220px;
      text-decoration: none;
    }

    .vault-tabs {
      width: min(960px, 98vw);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .vtab {
      background: rgba(5, 4, 10, 0.9);
      border: 1px solid var(--line-dim);
      padding: 11px 8px;
      text-align: center;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.28em;
      color: var(--dim);
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s;
    }

    .vtab:hover { border-color: var(--arcane); color: #fff; }

    .vtab.active {
      border-color: var(--gold);
      box-shadow: 0 0 16px rgba(255, 210, 61, 0.4);
      color: #fff;
      background: rgba(20, 14, 6, 0.5);
    }

    .studio-layout {
      width: min(960px, 98vw);
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .preview-frame {
      width: 230px;
      background: rgba(7, 6, 14, 0.92);
      border: 1px solid var(--line-dim);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: sticky;
      top: 20px;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .preview-card {
      border: 1px solid var(--gold);
      background: rgba(16, 15, 26, 0.9);
      box-shadow: 0 0 14px rgba(255, 210, 61, 0.25);
      padding: 10px;
      display: flex;
      justify-content: center;
      position: relative;
    }

    .preview-card::after {
      content: "";
      position: absolute;
      inset: -1px;
      background: linear-gradient(135deg, var(--arcane), var(--gold), var(--arcane));
      border-radius: inherit;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      -webkit-mask-composite: destination-out;
      pointer-events: none;
    }

    canvas {
      border: 1px solid var(--line-dim);
      background: #0c0a16;
      display: block;
      image-rendering: pixelated;
    }

    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ctrl-group label {
      font-size: 8.5px;
      letter-spacing: 0.2em;
      color: var(--dim);
      text-transform: uppercase;
    }

    select, input[type="range"] {
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.1em;
      background: rgba(0, 0, 0, 0.5);
      color: var(--bone);
      border: 1px solid var(--line-dim);
      padding: 5px 6px;
      outline: none;
      width: 100%;
    }

    select option {
      background: #0c0a16;
      color: var(--bone);
    }

    input[type="range"] { accent-color: var(--arcane); }

    .background-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--bone);
      font-size: 9px;
      letter-spacing: 0.12em;
      cursor: pointer;
    }

    .background-toggle input {
      accent-color: var(--arcane);
      margin: 0;
    }

    .export-btns {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .menu-btn {
      font-family: inherit;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--bone);
      background: rgba(5, 4, 10, 0.85);
      border: 1px solid var(--line-dim);
      padding: 8px 6px;
      cursor: pointer;
      flex: 1;
      text-transform: uppercase;
      text-align: center;
      transition: all 0.15s;
    }

    .menu-btn:hover {
      border-color: var(--gold);
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 210, 61, 0.3);
    }

    .vault-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 86vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .section-title {
      font-size: 11px;
      letter-spacing: 0.35em;
      color: var(--gold);
      margin-bottom: 10px;
      text-transform: uppercase;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title span {
      color: var(--dim);
      font-size: 9px;
      font-weight: normal;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .card {
      border: 1px solid var(--line-dim);
      background: var(--card-bg);
      padding: 11px 10px;
      min-height: 130px;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      transition: all 0.12s;
    }

    .card:hover { border-color: #3b3759; }

    .card.equipped {
      border: 1px solid var(--equipped-orange);
      box-shadow: 0 0 16px rgba(255, 138, 61, 0.4), inset 0 0 12px rgba(255, 138, 61, 0.15);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .card-symbol {
      font-size: 17px;
      line-height: 1;
      flex-shrink: 0;
      filter: drop-shadow(0 0 5px currentColor);
    }

    .card-name {
      font-size: 10.5px;
      letter-spacing: 0.18em;
      color: var(--bone);
      font-weight: bold;
    }

    .card-tag {
      position: absolute;
      top: 7px;
      right: 9px;
      font-size: 7.5px;
      letter-spacing: 0.16em;
      font-weight: bold;
    }

    .card-tag.equipped { color: var(--equipped-orange); }
    .card-tag.owned { color: #7dff5e; }
    .card.selected { border-color: var(--gold); box-shadow: 0 0 12px rgba(255,210,61,.28); }
    .rune-color-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:7px; }
    .rune-color-option { border:1px solid var(--line-dim); padding:7px; background:rgba(0,0,0,.4); cursor:pointer; display:flex; align-items:center; gap:7px; }
    .rune-color-option.selected { border-color:var(--gold); box-shadow:0 0 10px rgba(255,210,61,.25); }
    .rune-color-swatch { width:16px; height:16px; border-radius:50%; box-shadow:0 0 8px currentColor; flex:none; }
    .enemy-badge { font-size:7px; letter-spacing:.12em; color:var(--dim); margin-top:5px; }

    .card-cost {
      font-size: 8px;
      letter-spacing: 0.14em;
      color: var(--gold);
      margin-top: 6px;
      text-align: right;
    }

    .card-desc {
      font-size: 9px;
      line-height: 1.45;
      color: #c4c0db;
      letter-spacing: 0.04em;
      margin-top: 6px;
    }

    #status {
      font-size: 8.5px;
      letter-spacing: 0.18em;
      color: #5ee6ff;
      height: 11px;
      text-align: center;
      margin-top: 4px;
    }

    .pet-preview-hint {
      font-size: 8px;
      letter-spacing: 0.12em;
      color: var(--dim);
      text-align: center;
      margin-top: 6px;
      font-style: italic;
    }

    @media (max-width: 850px) {
      .card-grid { grid-template-columns: repeat(2, 1fr); }
      .studio-layout { flex-direction: column; }
      .preview-frame { width: 100%; position: static; }
      .vault-tabs { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="vault-header">THE VAULT STUDIO — SPRITES &amp; COMPANIONS</div>
  <nav class="studio-nav" aria-label="Site navigation">
    <a class="menu-btn" href="index.html">BACK TO RUNEGUN</a>
  </nav>

  <div class="vault-tabs">
    <button class="vtab" id="tabGunslingers">GUNSLINGERS</button>
    <button class="vtab active" id="tabPets">PETS</button>
    <button class="vtab" id="tabWarpaint">WARPAINT</button>
    <button class="vtab" id="tabEnemies">ENEMIES</button>
  </div>

  <div class="studio-layout">
    <div class="preview-frame">
      <div class="preview-card">
        <canvas id="spriteCanvas" width="160" height="160"></canvas>
      </div>

      <div class="ctrl-group">
        <label for="kindSelect">Kind</label>
        <select id="kindSelect">
          <option value="gunslinger">Gunslinger</option>
          <option value="pet" selected>Pet</option>
          <option value="enemy">Enemy</option>
        </select>
      </div>

      <div id="ctrlGunslinger" class="ctrl-group" style="display:none">
        <label for="charSelect">Warden</label>
        <select id="charSelect"></select>
      </div>

      <div id="ctrlPet" class="ctrl-group">
        <label for="petSelect">Companion</label>
        <select id="petSelect"></select>
      </div>

      <div id="ctrlEnemy" class="ctrl-group" style="display:none">
        <label for="enemySelect">Enemy</label>
        <select id="enemySelect"></select>
      </div>

      <div class="ctrl-group">
        <label for="aimRange">Aim Angle (<span id="aimVal">0°</span>)</label>
        <input type="range" id="aimRange" min="0" max="6.283185307179586" step="any" value="0">
      </div>

      <div class="ctrl-group">
        <label for="speedRange">Spin Speed (<span id="speedVal">0.08</span>)</label>
        <input type="range" id="speedRange" min="0" max="0.3" step="0.01" value="0.08">
      </div>

      <div class="ctrl-group">
        <label for="hpSelect">Vitality</label>
        <select id="hpSelect">
          <option value="1.0" selected>Healthy (100%)</option>
          <option value="0.4">Wounded (40%)</option>
          <option value="0.2">Critical (20%)</option>
        </select>
      </div>

      <div class="ctrl-group">
        <label for="backgroundToggle">Sprite Background</label>
        <label class="background-toggle">
          <input type="checkbox" id="backgroundToggle" checked>
          Arcane rune dial
        </label>
      </div>

      <div class="ctrl-group">
        <label for="scaleSelect">Export Scale</label>
        <select id="scaleSelect">
          <option value="1">1x (160px)</option>
          <option value="2">2x (320px)</option>
          <option value="4" selected>4x (640px)</option>
          <option value="8">8x (1280px)</option>
        </select>
      </div>

      <div class="export-btns">
        <button class="menu-btn" id="pngBtn">PNG</button>
        <button class="menu-btn" id="recordBtn">WEBM</button>
      </div>
      <div id="status"></div>
      <div class="pet-preview-hint">Cracks bloom below 50% · gold arcs below 30%</div>
    </div>

    <div class="vault-content" id="vaultContent"></div>
  </div>

  <script>const Meta = { skin: "bone", gunSkin: null, unlocked: {} };</script>
  <script src="src/data/characters.js"></script>
  <script src="src/data/runes.js"></script>
  <script src="src/entities/pets.js"></script>
  <script src="src/entities/enemies.js"></script>
  <script>
    const TAU = Math.PI * 2;

    const GUNSLG = Object.entries(CHARS).map(([id, c]) => ({
      id, name: c.name, symbol: c.glyph || "◉", color: c.color === "runelight" ? "#8a86a0" : c.color,
      desc: c.desc || ""
    }));
    const BODY_WARPAINTS = Object.entries(SKINS).map(([id, skin]) => ({ id, ...skin }));
    const GUN_WARPAINTS = [
      { id: "runelight", name: GUN_STOCK.name, color: GUN_STOCK.color, symbol: "◉", desc: GUN_STOCK.desc },
      ...Object.entries(SKINS).map(([id, skin]) => ({ id, name: skin.name, color: skin.color, symbol: "◉", desc: skin.desc }))
    ];

    let currentTab = "pets";
    let selectedBodyColor = BODY_WARPAINTS[1].color;
    let selectedGunColor = RUNES[Object.keys(RUNES)[0]].color;
    let selectedBodyPaintId = BODY_WARPAINTS[1].id;
    let selectedGunPaintId = "runelight";
    let selectedRuneId = Object.keys(RUNES)[0];

    const vaultContent = document.getElementById("vaultContent");
    const kindSel = document.getElementById("kindSelect");
    const charSel = document.getElementById("charSelect");
    const petSel = document.getElementById("petSelect");
    const enemySel = document.getElementById("enemySelect");
    const ctrlGunslinger = document.getElementById("ctrlGunslinger");
    const ctrlPet = document.getElementById("ctrlPet");
    const ctrlEnemy = document.getElementById("ctrlEnemy");

    const tabGunslingers = document.getElementById("tabGunslingers");
    const tabPets = document.getElementById("tabPets");
    const tabWarpaint = document.getElementById("tabWarpaint");
    const tabEnemies = document.getElementById("tabEnemies");

    const enemyNames = {
      chaser: "CHASER", gunner: "GUNNER", dasher: "DASHER", slammer: "SLAMMER",
      spitter: "SPITTER", wisp: "WISP", summoner: "NECROMANCER", shade: "SHADE",
      cinder: "CINDER", slag: "SLAGHULK", slagling: "SLAGLING", angler: "ANGLER",
      riptide: "RIPTIDE", phylactery: "PHYLACTERY", mourner: "MOURNER", lapse: "LAPSE",
      lumen: "LUMEN", penitent: "PENITENT", drifter: "DRIFTER", carrion: "CARRION",
      reflection: "REFLECTION", hollow: "HOLLOW", unkward: "UNKNOWN WARD",
      unkorb: "UNKNOWN ORB", unkhound: "UNKNOWN HOUND", unkwisp: "UNKNOWN WISP"
    };
    const enemyLabel = id => enemyNames[id] || id.toUpperCase().replace(/[-_]/g, " ");

    function populateSelect(select, values, label) {
      const previous = select.value;
      select.innerHTML = "";
      for (const [id, value] of values) {
        const option = document.createElement("option");
        option.value = id; option.textContent = label(id, value); select.appendChild(option);
      }
      if (values.some(([id]) => id === previous)) select.value = previous;
    }
    populateSelect(charSel, Object.entries(CHARS), (id, c) => c.name || id);
    populateSelect(petSel, Object.entries(PTYPES), (id, p) => (p.name || id) + " (" + (p.glyph || "◉") + ")");
    populateSelect(enemySel, Object.entries(ETYPES), id => enemyLabel(id));
    charSel.value = CHARS.necromancer ? "necromancer" : Object.keys(CHARS)[0];
    petSel.value = Object.keys(PTYPES)[0];
    enemySel.value = Object.keys(ETYPES)[0];

    const CRACKS_HALF = [
      [[0.15,-0.85],[0.05,-0.35],[0.42,-0.05],[0.30,0.42]],
      [[-0.72,0.30],[-0.30,0.15],[-0.36,-0.28]],
    ];
    const CRACKS_CRIT = CRACKS_HALF.concat([
      [[0.58,0.55],[0.20,0.30],[0.36,-0.12]],
      [[-0.20,0.82],[-0.08,0.35],[-0.46,0.10]],
      [[0.05,-0.38],[-0.16,-0.05],[0.00,0.36]],
    ]);

    function drawCracks(cx, hpFrac, s) {
      if (hpFrac > 0.5) return;
      const crit = hpFrac < 0.3;
      cx.shadowBlur = 0;
      cx.strokeStyle = "#0b0b14";
      cx.lineCap = "butt";
      cx.lineJoin = "miter";
      cx.lineWidth = crit ? 1.7 : 1.1;
      cx.beginPath();
      const polys = crit ? CRACKS_CRIT : CRACKS_HALF;
      for (const poly of polys) {
        cx.moveTo(poly[0][0] * s, poly[0][1] * s);
        for (let i = 1; i < poly.length; i++) cx.lineTo(poly[i][0] * s, poly[i][1] * s);
      }
      cx.stroke();
      if (crit) {
        const fl = Math.sin(Date.now() * 0.031) * Math.sin(Date.now() * 0.0173);
        if (fl > 0.35) {
          const j = Math.sin(Date.now() * 0.053) * 0.14;
          cx.strokeStyle = "#ffd23d";
          cx.shadowColor = "#ffd23d";
          cx.shadowBlur = 6;
          cx.lineWidth = 1;
          cx.globalAlpha = 0.9;
          cx.beginPath();
          cx.moveTo(0.30 * s, 0.42 * s);
          cx.lineTo((0.44 + j) * s, (0.58 - j) * s);
          cx.lineTo((0.36 - j) * s, (0.76 + j) * s);
          cx.moveTo(-0.46 * s, 0.10 * s);
          cx.lineTo((-0.60 + j) * s, (0.28 + j) * s);
          cx.lineTo((-0.52 - j) * s, (0.44 - j) * s);
          cx.stroke();
          cx.globalAlpha = 1;
        }
      }
    }

    function drawEnemyPreview(ctx, x, y, id, aim, time) {
      const def = ETYPES[id];
      if (!def) return;
      const r = Math.max(8, Math.min(25, def.r || 12));
      const color = def.color || "#e8e2d0";
      ctx.save(); ctx.translate(x, y); ctx.fillStyle = color; ctx.strokeStyle = color;
      ctx.shadowColor = color; ctx.shadowBlur = 10;
      if (id === "chaser") {
        ctx.rotate(aim); ctx.beginPath(); ctx.moveTo(r + 4, 0); ctx.lineTo(-r, r * .8); ctx.lineTo(-r * .4, 0); ctx.lineTo(-r, -r * .8); ctx.closePath(); ctx.fill();
      } else if (id === "gunner") {
        ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.fillStyle = "#0b0b14"; ctx.fillRect(Math.cos(aim) * 6 - 3, Math.sin(aim) * 6 - 3, 6, 6);
      } else if (id === "dasher") {
        ctx.rotate(aim + Math.PI / 4); ctx.fillRect(-r * .72, -r * .72, r * 1.44, r * 1.44);
      } else if (id === "slammer") {
        ctx.fillRect(-r, -r, r * 2, r * 2); ctx.fillStyle = "#0b0b14"; ctx.fillRect(-r * .4, -r * .35, 4, 4); ctx.fillRect(r * .2, -r * .35, 4, 4);
      } else if (id === "spitter") {
        ctx.rotate(time * 1.4); for (let i = 0; i < 5; i++) { ctx.rotate(TAU / 5); ctx.beginPath(); ctx.arc(r * .7, 0, r * .48, 0, TAU); ctx.fill(); }
        ctx.beginPath(); ctx.arc(0, 0, r * .55, 0, TAU); ctx.fill();
      } else if (id === "wisp" || id.startsWith("unkwisp")) {
        ctx.globalAlpha = .72; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
        ctx.globalAlpha = .38; ctx.beginPath(); ctx.arc(0, 0, r + 7 + Math.sin(time * 8) * 2, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1; ctx.fillStyle = "#0b0b14";
        ctx.beginPath(); ctx.arc(-r * .25, -r * .1, 2, 0, TAU); ctx.arc(r * .25, -r * .1, 2, 0, TAU); ctx.fill();
      } else if (id === "summoner") {
        ctx.rotate(Math.sin(time * 2) * .12); ctx.beginPath(); ctx.moveTo(0, -r - 5); ctx.lineTo(r, r); ctx.lineTo(-r, r); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#0d110c"; ctx.beginPath(); ctx.arc(0, 0, r * .35, 0, TAU); ctx.fill();
        ctx.fillStyle = "#d8ffb0"; ctx.beginPath(); ctx.arc(0, 0, r * .14, 0, TAU); ctx.fill();
      } else if (id === "shade" || id === "hollow") {
        const breathe = .72 + .18 * Math.sin(time * 4.4);
        ctx.globalAlpha = breathe; ctx.beginPath(); ctx.moveTo(-r, r * .55); ctx.lineTo(-r, -r * .1); ctx.arc(0, -r * .1, r, Math.PI, 0); ctx.lineTo(r, r * .55);
        for (let k = 1; k <= 5; k++) ctx.lineTo(r - k / 5 * r * 2, r * (k % 2 ? .25 : .6) + Math.sin(time * 3 + k) * 2);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1; ctx.fillStyle = "#0d110c";
        ctx.beginPath(); ctx.ellipse(-r * .34, -r * .22, r * .15, r * .24, 0, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.ellipse(r * .34, -r * .22, r * .15, r * .24, 0, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0, r * .28, r * .13, r * .2 * (1 + Math.sin(time * 1.3) * .35), 0, 0, TAU); ctx.fill();
      } else if (id === "cinder") {
        const pulse = 1 + Math.sin(time * 6) * .12; ctx.save(); ctx.scale(pulse, 2 - pulse);
        ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
        ctx.fillStyle = "#ffd23d"; ctx.beginPath(); ctx.arc(0, 0, r * .45, 0, TAU); ctx.fill(); ctx.restore();
      } else if (id === "slag" || id === "slagling") {
        const jag = [1.05, .9, 1.1, .85, 1.08, .92, 1.02, .88];
        ctx.rotate(time * .35); ctx.beginPath();
        for (let i = 0; i < 8; i++) { const a = i / 8 * TAU, rr = r * jag[i]; i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        ctx.closePath(); ctx.fill(); ctx.fillStyle = "#2a1410"; ctx.beginPath();
        for (let i = 0; i < 8; i++) { const a = i / 8 * TAU, rr = r * jag[i] * .62; i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        ctx.closePath(); ctx.fill(); ctx.fillStyle = "#ffd23d"; ctx.beginPath(); ctx.arc(0, 0, r * .3 * (1 + Math.sin(time * 7) * .12), 0, TAU); ctx.fill();
      } else if (id === "angler") {
        ctx.rotate(aim); ctx.globalAlpha = .9;
        ctx.beginPath(); ctx.moveTo(r * 1.05, -r * .15); ctx.quadraticCurveTo(0, -r * 1.05, -r, -r * .35);
        ctx.quadraticCurveTo(-r * 1.25, 0, -r, r * .35); ctx.quadraticCurveTo(0, r * 1.05, r * 1.05, r * .15);
        ctx.quadraticCurveTo(r * .55, 0, r * 1.05, -r * .15); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "#0d1a1f"; ctx.lineWidth = 2; ctx.beginPath();
        for (let k = 0; k <= 6; k++) { const xx = r * (1 - k * .1), yy = (k % 2 ? -1 : 1) * r * .13; k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
        ctx.stroke(); ctx.fillStyle = "#0d1a1f"; ctx.beginPath(); ctx.arc(-r * .15, -r * .4, r * .13, 0, TAU); ctx.fill();
        ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(r * .35, -r * .55); ctx.quadraticCurveTo(r * .9, -r * 1.1, r * 1.15 + 8, -r * .55); ctx.stroke();
        ctx.fillStyle = "#ffd23d"; ctx.shadowColor = "#ffd23d"; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(r * 1.15 + 8, -r * .55, 2.5 + Math.sin(time * 6.9), 0, TAU); ctx.fill();
      } else if (id === "riptide") {
        ctx.rotate(aim); ctx.globalAlpha = .88;
        ctx.beginPath(); ctx.moveTo(-r, r * .6); ctx.quadraticCurveTo(-r * .6, -r * 1.1, r * .7, -r * .35);
        ctx.quadraticCurveTo(r * 1.15, -r * .05, r * .8, r * .15); ctx.quadraticCurveTo(r * .4, 0, r * .45, r * .3);
        ctx.quadraticCurveTo(r, r * .45, r * .7, r * .6); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "#eafffb"; ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.globalAlpha = .95;
        for (let k = 0; k < 4; k++) { const fx = -r * .5 + k * r * .38 + Math.sin(time * 5 + k) * 2, fy = -r * (.95 - k * .18) + Math.cos(time * 6.5 + k) * 2; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx + r * .22, fy + r * .06); ctx.stroke(); }
      } else if (id === "phylactery") {
        const pulse = .65 + .35 * Math.sin(time * 7); ctx.rotate(Math.sin(time * 3) * .2);
        ctx.strokeStyle = "#d8ffb0"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(0, -r - 5); ctx.lineTo(r, 0); ctx.lineTo(0, r + 5); ctx.lineTo(-r, 0); ctx.closePath(); ctx.stroke();
        ctx.globalAlpha = pulse; ctx.fillStyle = "#d8ffb0"; ctx.beginPath(); ctx.arc(0, 0, r * .5, 0, TAU); ctx.fill();
        ctx.globalAlpha = .35 * pulse; ctx.beginPath(); ctx.arc(0, 0, r * .8, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
      } else {
        // Future enemy IDs automatically get a visible, tinted preview until a special silhouette is added.
        ctx.rotate(aim); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
        ctx.fillStyle = "#0b0b14"; ctx.font = "bold 9px monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(id.slice(0, 1).toUpperCase(), 0, 1);
      }
      ctx.restore();
    }

    let gameTime = 0;

    function drawRuneDialBackground(ctx, width, height) {
      const cx = width / 2;
      const cy = height / 2;
      const radius = Math.min(width, height) * 0.45;
      const outerRadius = radius * 0.98;
      const innerRadius = radius * 0.78;
      const faceRadius = radius * 0.55;

      const backdrop = ctx.createRadialGradient(cx, cy, radius * 0.08, cx, cy, Math.max(width, height) * 0.72);
      backdrop.addColorStop(0, "#171329");
      backdrop.addColorStop(0.58, "#0c0a17");
      backdrop.addColorStop(1, "#05040a");
      ctx.fillStyle = backdrop;
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.strokeStyle = "#59439f";
      ctx.shadowColor = "#7654cf";
      ctx.shadowBlur = 7;
      ctx.globalAlpha = 0.78;
      ctx.lineWidth = Math.max(1, radius * 0.025);
      ctx.beginPath();
      ctx.arc(0, 0, outerRadius, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 0.62;
      ctx.lineWidth = Math.max(0.8, radius * 0.018);
      ctx.beginPath();
      ctx.arc(0, 0, innerRadius, 0, TAU);
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.globalAlpha = 0.44;
      ctx.strokeStyle = "#423477";
      ctx.lineWidth = Math.max(0.7, radius * 0.012);
      ctx.beginPath();
      ctx.arc(0, 0, faceRadius, 0, TAU);
      ctx.stroke();

      // Fine radial marks and angular rune-like signs around the outer band.
      for (let i = 0; i < 24; i++) {
        const angle = i / 24 * TAU - Math.PI / 2;
        const major = i % 3 === 0;
        const inner = outerRadius * (major ? 0.86 : 0.91);
        const outer = outerRadius * 0.96;
        ctx.globalAlpha = major ? 0.72 : 0.38;
        ctx.strokeStyle = major ? "#8063d4" : "#57458f";
        ctx.lineWidth = major ? Math.max(1, radius * 0.018) : Math.max(0.7, radius * 0.011);
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * inner, Math.sin(angle) * inner);
        ctx.lineTo(Math.cos(angle) * outer, Math.sin(angle) * outer);
        ctx.stroke();
      }

      const runes = ["ᚠ", "ᚢ", "ᚦ", "ᚨ", "ᚱ", "ᚲ", "ᚷ", "ᚹ"];
      ctx.font = `bold ${Math.max(7, radius * 0.16)}px monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      runes.forEach((rune, i) => {
        const angle = i / runes.length * TAU - Math.PI / 2 + Math.PI / runes.length;
        const runeRadius = (outerRadius + innerRadius) / 2;
        ctx.save();
        ctx.translate(Math.cos(angle) * runeRadius, Math.sin(angle) * runeRadius);
        ctx.rotate(angle + Math.PI / 2);
        ctx.globalAlpha = 0.66;
        ctx.fillStyle = "#8064c7";
        ctx.fillText(rune, 0, 0);
        ctx.restore();
      });

      // Short broken arcs and spokes echo the engraved inner dial without a center emblem.
      ctx.globalAlpha = 0.36;
      ctx.strokeStyle = "#514183";
      ctx.lineWidth = Math.max(0.8, radius * 0.014);
      for (let i = 0; i < 8; i++) {
        const angle = i / 8 * TAU;
        ctx.beginPath();
        ctx.arc(0, 0, faceRadius * 0.78, angle + 0.12, angle + 0.48);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * faceRadius * 0.9, Math.sin(angle) * faceRadius * 0.9);
        ctx.lineTo(Math.cos(angle) * faceRadius * 1.2, Math.sin(angle) * faceRadius * 1.2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function renderSprite(targetCtx, width, height, scale, timeVal, bodyColor, weaponColor, kind, typeId, hpFrac, customAim, includeBackground = false) {
      targetCtx.save();
      targetCtx.clearRect(0, 0, width, height);
      targetCtx.scale(scale, scale);

      if (includeBackground) drawRuneDialBackground(targetCtx, width / scale, height / scale);

      const baseW = width / scale;
      const baseH = height / scale;
      const px = Math.floor(baseW / 2);
      const py = Math.floor(baseH / 2);
      const aim = customAim;
      const perpX = -Math.sin(aim);
      const perpY = Math.cos(aim);
      const col = bodyColor;
      const tint = weaponColor;

      if (kind === "pet") {
        const T = PTYPES[typeId];
        targetCtx.save(); targetCtx.translate(px, py);
        
        // If Sentinel Orb (orbiter), render the matching outer transparent/glow ring
        if (typeId === "orbiter") {
          targetCtx.save();
          targetCtx.strokeStyle = T.color;
          targetCtx.lineWidth = 1.8;
          targetCtx.globalAlpha = 0.65;
          targetCtx.beginPath();
          targetCtx.arc(0, 0, T.r + 4.5, 0, TAU);
          targetCtx.stroke();
          targetCtx.restore();
        }

        targetCtx.fillStyle = "#0b0b14";
        targetCtx.beginPath(); targetCtx.arc(0, 0, T.r + 2, 0, TAU); targetCtx.fill();
        targetCtx.shadowColor = T.color; targetCtx.shadowBlur = 10;
        targetCtx.globalAlpha = 0.92; targetCtx.fillStyle = T.color;
        targetCtx.beginPath(); targetCtx.arc(0, 0, T.r, 0, TAU); targetCtx.fill();
        targetCtx.shadowBlur = 0; targetCtx.globalAlpha = 1;
        targetCtx.fillStyle = "#0b0b14";
        targetCtx.font = "bold " + (T.r + 1) + "px monospace";
        targetCtx.textAlign = "center"; targetCtx.textBaseline = "middle";
        targetCtx.fillText(T.glyph, 0, 1);
        targetCtx.restore();
        targetCtx.restore();
        return;
      }

      if (kind === "enemy") {
        const E = ETYPES[typeId];
        if (E) drawEnemyPreview(targetCtx, px, py, typeId, customAim, timeVal);
        targetCtx.restore();
        return;
      }

      const P = { char: typeId, r: 12, mods: { sawReach: 76 }, sawRot: timeVal };
      const Game = { time: timeVal };

      if (P.char === "shredder") {
        targetCtx.save(); targetCtx.translate(px, py);
        targetCtx.save();
        const sawR = P.mods.sawReach || 76;
        targetCtx.rotate(P.sawRot || 0);
        targetCtx.strokeStyle = weaponColor; targetCtx.lineWidth = 3;
        targetCtx.beginPath(); targetCtx.arc(0, 0, sawR * 0.65, 0, TAU); targetCtx.stroke();
        targetCtx.fillStyle = weaponColor;
        const teeth = 12;
        for (let i = 0; i < teeth; i++) {
          targetCtx.rotate(TAU / teeth);
          targetCtx.beginPath();
          targetCtx.moveTo(sawR * 0.6, -3);
          targetCtx.lineTo(sawR * 0.95, 0);
          targetCtx.lineTo(sawR * 0.6, 3);
          targetCtx.closePath(); targetCtx.fill();
        }
        targetCtx.restore();

        targetCtx.rotate(aim);
        targetCtx.fillStyle = bodyColor;
        targetCtx.beginPath(); targetCtx.moveTo(-10, -12); targetCtx.lineTo(12, -8); targetCtx.lineTo(12, 8); targetCtx.lineTo(-10, 12); targetCtx.closePath(); targetCtx.fill();
        targetCtx.fillStyle = "#0b0b14"; targetCtx.fillRect(2, -3, 6, 6);
        targetCtx.beginPath(); targetCtx.arc(0, 0, 8, 0, TAU); targetCtx.fill();
        targetCtx.fillStyle = bodyColor;
        targetCtx.font = "bold 9px monospace"; targetCtx.textAlign = "center"; targetCtx.textBaseline = "middle";
        targetCtx.fillText("ᛃ", 0, 1);
        drawCracks(targetCtx, hpFrac, 12);
        targetCtx.restore();

      } else if (P.char === "necromancer") {
        targetCtx.save(); targetCtx.translate(px, py);
        targetCtx.fillStyle = bodyColor;
        targetCtx.beginPath(); targetCtx.moveTo(0, -10); targetCtx.quadraticCurveTo(12, -8, 10, 8);
        targetCtx.lineTo(-10, 8); targetCtx.quadraticCurveTo(-12, -8, 0, -10); targetCtx.closePath(); targetCtx.fill();

        targetCtx.fillStyle = "#e8e2d0";
        for (const side of [-1, 1]) { targetCtx.beginPath(); targetCtx.arc(side * 9, -5, 4, 0, TAU); targetCtx.fill(); }

        const pulse = 0.6 + 0.4 * Math.sin(Game.time * 5);
        targetCtx.fillStyle = "#9d6bff"; targetCtx.shadowColor = "#9d6bff"; targetCtx.shadowBlur = 10 * pulse;
        targetCtx.beginPath(); targetCtx.arc(0, 0, 4, 0, TAU); targetCtx.fill(); targetCtx.shadowBlur = 0;

        targetCtx.save(); targetCtx.translate(0, -14 + Math.sin(Game.time * 2.5) * 2);
        targetCtx.fillStyle = "#e8e2d0"; targetCtx.beginPath(); targetCtx.arc(0, 0, 5, 0, TAU); targetCtx.fill();
        targetCtx.fillRect(-2.5, 3, 5, 2); targetCtx.fillStyle = "#0b0b14";
        targetCtx.beginPath(); targetCtx.arc(-1.5, 0, 1.2, 0, TAU); targetCtx.fill();
        targetCtx.beginPath(); targetCtx.arc(1.5, 0, 1.2, 0, TAU); targetCtx.fill(); targetCtx.restore();

        targetCtx.rotate(aim); targetCtx.strokeStyle = weaponColor; targetCtx.lineWidth = 2.5;
        targetCtx.beginPath(); targetCtx.moveTo(0, 0); targetCtx.lineTo(24, 0); targetCtx.stroke();
        targetCtx.save(); targetCtx.translate(24, 0); targetCtx.rotate(-aim + Game.time * 2);
        targetCtx.fillStyle = weaponColor; targetCtx.font = "bold 10px monospace"; targetCtx.textAlign = "center"; targetCtx.textBaseline = "middle";
        targetCtx.fillText("ᚻ", 0, 0); targetCtx.restore();
        drawCracks(targetCtx, hpFrac, 12);
        targetCtx.restore();

      } else if (P.char === "gunsmith") {
        targetCtx.save(); targetCtx.translate(px, py); targetCtx.rotate(aim + Math.PI / 2);
        targetCtx.fillStyle = bodyColor;
        targetCtx.beginPath();
        for (let i = 0; i < 5; i++) { const a = i / 5 * TAU - Math.PI / 2; i === 0 ? targetCtx.moveTo(Math.cos(a)*13, Math.sin(a)*13) : targetCtx.lineTo(Math.cos(a)*13, Math.sin(a)*13); }
        targetCtx.closePath(); targetCtx.fill();
        targetCtx.fillStyle = "#0b0b14"; targetCtx.fillRect(-7, -2.5, 14, 5);
        drawCracks(targetCtx, hpFrac, 13);
        targetCtx.restore();
        targetCtx.strokeStyle = weaponColor; targetCtx.lineWidth = 3; targetCtx.lineCap = "round";
        for (const s of [-3.5, 3.5]) {
          targetCtx.beginPath();
          targetCtx.moveTo(px + Math.cos(aim)*9 + perpX*s, py + Math.sin(aim)*9 + perpY*s);
          targetCtx.lineTo(px + Math.cos(aim)*27 + perpX*s, py + Math.sin(aim)*27 + perpY*s);
          targetCtx.stroke();
        }

      } else if (P.char === "wraith") {
        targetCtx.save(); targetCtx.translate(px, py); targetCtx.rotate(aim);
        targetCtx.fillStyle = bodyColor;
        targetCtx.beginPath(); targetCtx.moveTo(0,-12); targetCtx.lineTo(9,0); targetCtx.lineTo(0,12); targetCtx.lineTo(-9,0); targetCtx.closePath(); targetCtx.fill();
        targetCtx.strokeStyle = bodyColor; targetCtx.lineWidth = 2;
        for (const [oy, ex] of [[-7,-27],[0,-30],[7,-27]]) {
          targetCtx.globalAlpha = 0.45;
          targetCtx.beginPath(); targetCtx.moveTo(-9, 0); targetCtx.quadraticCurveTo(-18, oy * 0.4, ex, oy); targetCtx.stroke();
        }
        targetCtx.globalAlpha = 1;
        targetCtx.fillStyle = "#0b0b14"; targetCtx.beginPath(); targetCtx.arc(3, 0, 3, 0, TAU); targetCtx.fill();
        targetCtx.restore();
        drawCracks(targetCtx, hpFrac, 12);
        targetCtx.strokeStyle = weaponColor; targetCtx.lineWidth = 2; targetCtx.lineCap = "round";
        targetCtx.beginPath(); targetCtx.moveTo(px+Math.cos(aim)*10, py+Math.sin(aim)*10);
        targetCtx.lineTo(px+Math.cos(aim)*31, py+Math.sin(aim)*31);
        targetCtx.stroke();

      } else if (P.char === "juggernaut") {
        targetCtx.save(); targetCtx.translate(px, py);
        targetCtx.fillStyle = bodyColor;
        targetCtx.beginPath();
        for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; i === 0 ? targetCtx.moveTo(Math.cos(a)*17, Math.sin(a)*17) : targetCtx.lineTo(Math.cos(a)*17, Math.sin(a)*17); }
        targetCtx.closePath(); targetCtx.fill();
        targetCtx.fillStyle = bodyColor;
        for (const s of [-1, 1]) { targetCtx.beginPath(); targetCtx.arc(perpX*17*s, perpY*17*s, 7, 0, TAU); targetCtx.fill(); }
        targetCtx.fillStyle = "#0b0b14"; targetCtx.save(); targetCtx.rotate(aim + Math.PI / 2); targetCtx.fillRect(-10, -2.5, 20, 5); targetCtx.restore();
        drawCracks(targetCtx, hpFrac, 17);
        targetCtx.restore();

        targetCtx.strokeStyle = weaponColor; targetCtx.lineWidth = 10; targetCtx.lineCap = "square";
        targetCtx.beginPath(); targetCtx.moveTo(px+Math.cos(aim)*13, py+Math.sin(aim)*13); targetCtx.lineTo(px+Math.cos(aim)*27, py+Math.sin(aim)*27); targetCtx.stroke();
        targetCtx.strokeStyle = "#0b0b14"; targetCtx.lineWidth = 4;
        targetCtx.beginPath(); targetCtx.moveTo(px+Math.cos(aim)*21, py+Math.sin(aim)*21); targetCtx.lineTo(px+Math.cos(aim)*28, py+Math.sin(aim)*28); targetCtx.stroke();

      } else if (P.char === "demolitionist") {
        targetCtx.save(); targetCtx.translate(px, py); targetCtx.rotate(aim + Math.PI / 2);
        targetCtx.fillStyle = bodyColor;
        targetCtx.beginPath();
        for (let i = 0; i < 8; i++) { const a = i / 8 * TAU + Math.PI / 8; i === 0 ? targetCtx.moveTo(Math.cos(a)*14, Math.sin(a)*14) : targetCtx.lineTo(Math.cos(a)*14, Math.sin(a)*14); }
        targetCtx.closePath(); targetCtx.fill();
        targetCtx.fillStyle = "#0b0b14"; targetCtx.fillRect(-6, -3, 12, 5);
        targetCtx.fillStyle = "#0b0b14";
        targetCtx.beginPath(); targetCtx.arc(0, 10, 4.5, 0, TAU); targetCtx.fill();
        if (Math.sin(Game.time * 7) > 0) { targetCtx.fillStyle = "#ffd23d"; targetCtx.beginPath(); targetCtx.arc(0, 10, 1.8, 0, TAU); targetCtx.fill(); }
        drawCracks(targetCtx, hpFrac, 14);
        targetCtx.restore();
        targetCtx.strokeStyle = weaponColor; targetCtx.lineWidth = 7; targetCtx.lineCap = "round";
        targetCtx.beginPath(); targetCtx.moveTo(px+Math.cos(aim)*11, py+Math.sin(aim)*11); targetCtx.lineTo(px+Math.cos(aim)*21, py+Math.sin(aim)*21); targetCtx.stroke();
        targetCtx.strokeStyle = "#0b0b14"; targetCtx.lineWidth = 3;
        targetCtx.beginPath(); targetCtx.moveTo(px+Math.cos(aim)*16, py+Math.sin(aim)*16); targetCtx.lineTo(px+Math.cos(aim)*22, py+Math.sin(aim)*22); targetCtx.stroke();

      } else if (P.char === "alchemist") {
        targetCtx.save(); targetCtx.translate(px, py); targetCtx.rotate(aim + Math.PI / 2);
        targetCtx.fillStyle = bodyColor;
        targetCtx.beginPath(); targetCtx.moveTo(0,-13); targetCtx.lineTo(12,11); targetCtx.lineTo(-12,11); targetCtx.closePath(); targetCtx.fill();
        targetCtx.fillStyle = "#0b0b14"; targetCtx.fillRect(-3, -18, 6, 7);
        drawCracks(targetCtx, hpFrac, 13);
        targetCtx.restore();

        targetCtx.save();
        const orbitA = Game.time * 2.8;
        targetCtx.font = "bold 10px monospace"; targetCtx.textAlign = "center"; targetCtx.textBaseline = "middle";
        targetCtx.globalAlpha = 0.85; targetCtx.fillStyle = col;
        targetCtx.fillText("ᛜ", px + Math.cos(orbitA)*21, py + Math.sin(orbitA)*21);
        targetCtx.restore();

        targetCtx.strokeStyle = tint; targetCtx.lineWidth = 2.5; targetCtx.lineCap = "round";
        if (hpFrac < 0.3) {
          targetCtx.beginPath(); targetCtx.moveTo(px+Math.cos(aim)*9, py+Math.sin(aim)*9);
          targetCtx.lineTo(px+Math.cos(aim)*16, py+Math.sin(aim)*16);
          targetCtx.lineTo(px+Math.cos(aim)*22 + perpX*2, py+Math.sin(aim)*22 + perpY*2); targetCtx.stroke();
          const bx = px+Math.cos(aim)*22 + perpX*2, by = py+Math.sin(aim)*22 + perpY*2;
          targetCtx.beginPath(); targetCtx.moveTo(bx, by); targetCtx.lineTo(bx + Math.cos(aim)*3 + perpX*8, by + Math.sin(aim)*3 + perpY*8); targetCtx.stroke();
          targetCtx.beginPath(); targetCtx.moveTo(bx, by); targetCtx.lineTo(bx - Math.cos(aim)*1 - perpX*5, by - Math.sin(aim)*1 - perpY*5); targetCtx.stroke();
        } else {
          targetCtx.beginPath(); targetCtx.moveTo(px+Math.cos(aim)*9, py+Math.sin(aim)*9); targetCtx.lineTo(px+Math.cos(aim)*22, py+Math.sin(aim)*22); targetCtx.stroke();
          const tipX = px+Math.cos(aim)*27, tipY = py+Math.sin(aim)*27;
          for (const s of [-1, 1]) {
            targetCtx.beginPath(); targetCtx.moveTo(px+Math.cos(aim)*22, py+Math.sin(aim)*22); targetCtx.lineTo(tipX+perpX*4*s, tipY+perpY*4*s); targetCtx.stroke();
          }
        }

      } else if (P.char === "theUnknown") {
        targetCtx.save(); targetCtx.translate(px, py);
        const ua = Game.time * 0.9;
        for (let k = 0; k < 3; k++) {
          const a = ua + k * TAU / 3;
          targetCtx.fillStyle = "rgba(201,184,255," + (0.35 + 0.25 * Math.sin(Game.time * 2 + k)) + ")";
          targetCtx.beginPath(); targetCtx.arc(Math.cos(a) * 14, Math.sin(a) * 14, 3, 0, TAU); targetCtx.fill();
        }
        targetCtx.fillStyle = "#0a0818";
        targetCtx.beginPath(); targetCtx.arc(0, 0, P.r + 2, 0, TAU); targetCtx.fill();
        targetCtx.strokeStyle = col; targetCtx.lineWidth = 2;
        targetCtx.beginPath(); targetCtx.arc(0, 0, P.r, 0, TAU); targetCtx.stroke();
        targetCtx.fillStyle = col; targetCtx.font = "bold 10px monospace"; targetCtx.textAlign = "center"; targetCtx.textBaseline = "middle";
        targetCtx.fillText("?", 0, 1);
        drawCracks(targetCtx, hpFrac, 12);
        targetCtx.restore();
      } else if (P.char === "sancho") {
        targetCtx.save(); targetCtx.translate(px, py); targetCtx.rotate(aim);
        targetCtx.fillStyle = bodyColor;
        targetCtx.beginPath(); targetCtx.moveTo(-2, -13); targetCtx.lineTo(9, -10); targetCtx.lineTo(14, -3);
        targetCtx.lineTo(11, 10); targetCtx.lineTo(0, 14); targetCtx.lineTo(-10, 7); targetCtx.lineTo(-12, -5); targetCtx.closePath(); targetCtx.fill();
        targetCtx.fillStyle = "#0b0b14"; targetCtx.fillRect(2, -4, 7, 2.5);
        targetCtx.strokeStyle = "#ff6675"; targetCtx.lineWidth = 2.4; targetCtx.lineCap = "round"; targetCtx.lineJoin = "round";
        // Stage-one fists; the gameplay upgrades this silhouette to saber/lance or bow.
        targetCtx.fillStyle = "#ff6675";
        for (const side of [-1, 1]) { targetCtx.beginPath(); targetCtx.arc(11, side * 8, 3.2, 0, TAU); targetCtx.fill(); }
        drawCracks(targetCtx, hpFrac, 10);
        targetCtx.restore();
      } else {
        // New character IDs appear automatically; show their configured glyph and palette.
        const C = CHARS[P.char] || {};
        targetCtx.save(); targetCtx.translate(px, py); targetCtx.rotate(aim + Math.PI / 2);
        targetCtx.fillStyle = bodyColor; targetCtx.beginPath();
        targetCtx.moveTo(0, -13); targetCtx.lineTo(12, 9); targetCtx.lineTo(7, 13); targetCtx.lineTo(-7, 13); targetCtx.lineTo(-12, 9); targetCtx.closePath(); targetCtx.fill();
        targetCtx.fillStyle = "#0b0b14"; targetCtx.fillRect(-7, -3, 14, 5);
        targetCtx.fillStyle = "#e8e2d0"; targetCtx.font = "bold 8px monospace"; targetCtx.textAlign = "center"; targetCtx.textBaseline = "middle";
        targetCtx.fillText(C.glyph || "◉", 0, 3); drawCracks(targetCtx, hpFrac, 12); targetCtx.restore();
        targetCtx.strokeStyle = weaponColor; targetCtx.lineWidth = 2.5; targetCtx.beginPath();
        targetCtx.moveTo(px + Math.cos(aim) * 11, py + Math.sin(aim) * 11);
        targetCtx.lineTo(px + Math.cos(aim) * 25, py + Math.sin(aim) * 25); targetCtx.stroke();
      }

      targetCtx.restore();
    }

    function renderVaultView() {
      vaultContent.innerHTML = "";
      for (const [tab, key] of [[tabGunslingers, "gunslingers"], [tabPets, "pets"], [tabWarpaint, "warpaint"], [tabEnemies, "enemies"]])
        tab.classList.toggle("active", currentTab === key);

      if (currentTab === "gunslingers") {
        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent = "GUNSLINGERS";
        vaultContent.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "card-grid";

        GUNSLG.forEach(g => {
          const isEquipped = kindSel.value === "gunslinger" && charSel.value === g.id;
          const card = document.createElement("div");
          card.className = `card ${isEquipped ? "equipped" : ""}`;
          card.innerHTML = `
            <div class="card-tag ${isEquipped ? "equipped" : "owned"}">${isEquipped ? "EQUIPPED" : "OWNED"}</div>
            <div class="card-top">
              <span class="card-symbol" style="color:${g.color}">${g.symbol}</span>
              <div class="card-name">${g.name}</div>
            </div>
            <div class="card-desc">${g.desc}</div>
          `;
          card.addEventListener("click", () => {
            kindSel.value = "gunslinger";
            charSel.value = g.id;
            setKindControls("gunslinger");
            renderVaultView();
          });
          grid.appendChild(card);
        });
        vaultContent.appendChild(grid);

      } else if (currentTab === "pets") {
        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent = "COMPANIONS";
        vaultContent.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "card-grid";

        Object.entries(PTYPES).forEach(([id, T]) => {
          const isEquipped = kindSel.value === "pet" && petSel.value === id;
          const card = document.createElement("div");
          card.className = `card ${isEquipped ? "equipped" : ""}`;
          card.style.color = T.color;
          card.innerHTML = `
            <div class="card-tag ${isEquipped ? "equipped" : "owned"}" style="color:${T.color}">${isEquipped ? "EQUIPPED" : "OWNED"}</div>
            <div class="card-top">
              <span class="card-symbol">${T.glyph}</span>
              <div class="card-name">${T.name}</div>
            </div>
            <div class="card-cost">${T.cost.toLocaleString()} SOULS</div>
            <div class="card-desc">${T.desc}</div>
          `;
          card.addEventListener("click", () => {
            kindSel.value = "pet";
            petSel.value = id;
            setKindControls("pet");
            renderVaultView();
          });
          grid.appendChild(card);
        });
        vaultContent.appendChild(grid);

      } else if (currentTab === "enemies") {
        const title = document.createElement("div");
        title.className = "section-title";
        title.textContent = "ENEMY ARCHETYPES";
        vaultContent.appendChild(title);
        const grid = document.createElement("div"); grid.className = "card-grid";
        Object.entries(ETYPES).forEach(([id, E]) => {
          const card = document.createElement("div");
          card.className = "card" + (kindSel.value === "enemy" && enemySel.value === id ? " equipped" : "");
          card.style.color = E.color || "var(--bone)";
          const thumb = document.createElement("canvas"); thumb.width = thumb.height = 64;
          thumb.style.width = "64px"; thumb.style.height = "64px"; thumb.style.marginBottom = "6px";
          renderSprite(thumb.getContext("2d"), 64, 64, 0.4, gameTime, E.color || "#e8e2d0", E.color || "#e8e2d0", "enemy", id, 1, 0);
          card.appendChild(thumb);
          const name = document.createElement("div"); name.className = "card-name"; name.textContent = enemyLabel(id); card.appendChild(name);
          const stats = document.createElement("div"); stats.className = "enemy-badge";
          stats.textContent = "HP " + E.hp + " · SPEED " + E.speed + " · SCORE " + E.score;
          card.appendChild(stats);
          card.addEventListener("click", () => { kindSel.value = "enemy"; enemySel.value = id; setKindControls("enemy"); renderVaultView(); });
          grid.appendChild(card);
        });
        vaultContent.appendChild(grid);

      } else {

        const sec1 = document.createElement("div");
        sec1.innerHTML = `<div class="section-title">BODY WARPAINT</div>`;
        const bodyGrid = document.createElement("div");
        bodyGrid.className = "card-grid";

        BODY_WARPAINTS.forEach(wp => {
          const isEquipped = wp.id === selectedBodyPaintId;
          const card = document.createElement("div");
          card.className = `card ${isEquipped ? "equipped" : ""}`;
          card.innerHTML = `
            <div class="card-tag ${isEquipped ? "equipped" : "owned"}" ${!isEquipped ? `style="color:${wp.color}"` : ""}>${isEquipped ? "EQUIPPED" : "OWNED"}</div>
            <div class="card-top">
              <span class="card-symbol" style="color: ${wp.color};">◉</span>
              <div class="card-name">${wp.name}</div>
            </div>
            <div class="card-desc">${wp.desc}</div>
          `;
          card.addEventListener("click", () => {
            selectedBodyPaintId = wp.id;
            selectedBodyColor = wp.color;
            renderVaultView();
          });
          bodyGrid.appendChild(card);
        });
        sec1.appendChild(bodyGrid);
        vaultContent.appendChild(sec1);

        const sec2 = document.createElement("div");
        sec2.style.marginTop = "10px";
        sec2.innerHTML = `<div class="section-title">GUN WARPAINT <span>— worn on either</span></div>`;
        const gunGrid = document.createElement("div");
        gunGrid.className = "card-grid";

        GUN_WARPAINTS.forEach(wp => {
          const isEquipped = wp.id === selectedGunPaintId;
          const card = document.createElement("div");
          card.className = `card ${isEquipped ? "equipped" : ""}`;
          card.innerHTML = `
            <div class="card-tag ${isEquipped ? "equipped" : "owned"}" ${!isEquipped ? `style="color:${wp.color}"` : ""}>${isEquipped ? "EQUIPPED" : "OWNED"}</div>
            <div class="card-top">
              <span class="card-symbol" style="color: ${wp.color};">${wp.symbol}</span>
              <div class="card-name">${wp.name}</div>
            </div>
            <div class="card-desc">${wp.desc}</div>
          `;
          card.addEventListener("click", () => {
            selectedGunPaintId = wp.id;
            if (wp.id === "runelight") selectedGunColor = RUNES[selectedRuneId]?.color || RUNES[Object.keys(RUNES)[0]].color;
            else selectedGunColor = wp.color;
            renderVaultView();
          });
          gunGrid.appendChild(card);
        });
        sec2.appendChild(gunGrid);
        if (selectedGunPaintId === "runelight") {
          const runeTitle = document.createElement("div"); runeTitle.className = "section-title";
          runeTitle.style.marginTop = "14px"; runeTitle.textContent = "RUNELIGHT COLOR · SELECT A RUNE";
          sec2.appendChild(runeTitle);
          const runeGrid = document.createElement("div"); runeGrid.className = "rune-color-grid";
          Object.entries(RUNES).forEach(([id, rune]) => {
            const option = document.createElement("button"); option.type = "button";
            option.className = "rune-color-option" + (id === selectedRuneId ? " selected" : "");
            option.style.color = rune.color; option.title = rune.desc || rune.name;
            option.innerHTML = `<span class="rune-color-swatch" style="background:${rune.color}"></span><span>${rune.glyph || "◉"} ${rune.name}</span>`;
            option.addEventListener("click", () => {
              selectedGunPaintId = "runelight"; selectedRuneId = id; selectedGunColor = rune.color; renderVaultView();
            });
            runeGrid.appendChild(option);
          });
          sec2.appendChild(runeGrid);
        }
        vaultContent.appendChild(sec2);
      }
    }

    function setKindControls(kind) {
      ctrlGunslinger.style.display = kind === "gunslinger" ? "" : "none";
      ctrlPet.style.display = kind === "pet" ? "" : "none";
      ctrlEnemy.style.display = kind === "enemy" ? "" : "none";
    }
    function selectedTypeId() {
      if (kindSel.value === "pet") return petSel.value;
      if (kindSel.value === "enemy") return enemySel.value;
      return charSel.value;
    }

    function animate() {
      gameTime += parseFloat(speedRange.value);
      const hp = parseFloat(hpSelect.value);
      const currentAim = parseFloat(aimRange.value);
      const kind = kindSel.value;
      const typeId = selectedTypeId();
      renderSprite(cx, canvas.width, canvas.height, 1, gameTime, selectedBodyColor, selectedGunColor, kind, typeId, hp, currentAim, backgroundToggle.checked);
      requestAnimationFrame(animate);
    }

    const canvas = document.getElementById("spriteCanvas");
    const cx = canvas.getContext("2d");
    const speedRange = document.getElementById("speedRange");
    const speedVal = document.getElementById("speedVal");
    const aimRange = document.getElementById("aimRange");
    const aimVal = document.getElementById("aimVal");
    const hpSelect = document.getElementById("hpSelect");
    const scaleSelect = document.getElementById("scaleSelect");
    const backgroundToggle = document.getElementById("backgroundToggle");

    speedRange.addEventListener("input", () => speedVal.textContent = speedRange.value);
    aimRange.addEventListener("input", () => {
      const deg = Math.round((parseFloat(aimRange.value) * 180) / Math.PI);
      aimVal.textContent = `${deg}°`;
    });

    kindSel.addEventListener("change", () => {
      const tabForKind = { gunslinger: "gunslingers", pet: "pets", enemy: "enemies" };
      setKindControls(kindSel.value);
      currentTab = tabForKind[kindSel.value] || "gunslingers";
      renderVaultView();
    });

    charSel.addEventListener("change", renderVaultView);
    petSel.addEventListener("change", renderVaultView);
    enemySel.addEventListener("change", renderVaultView);

    tabGunslingers.addEventListener("click", () => {
      currentTab = "gunslingers";
      kindSel.value = "gunslinger";
      setKindControls("gunslinger");
      renderVaultView();
    });
    tabPets.addEventListener("click", () => {
      currentTab = "pets";
      kindSel.value = "pet";
      setKindControls("pet");
      renderVaultView();
    });
    tabWarpaint.addEventListener("click", () => { currentTab = "warpaint"; renderVaultView(); });
    tabEnemies.addEventListener("click", () => {
      currentTab = "enemies"; kindSel.value = "enemy"; setKindControls("enemy"); renderVaultView();
    });

    document.getElementById("pngBtn").addEventListener("click", () => {
      const scale = parseInt(scaleSelect.value);
      const hp = parseFloat(hpSelect.value);
      const currentAim = parseFloat(aimRange.value);
      const kind = kindSel.value;
      const typeId = selectedTypeId();
      const includeBackground = backgroundToggle.checked;
      const exportCanvas = document.createElement("canvas");
      exportCanvas.width = 160 * scale;
      exportCanvas.height = 160 * scale;
      const exportCtx = exportCanvas.getContext("2d");
      renderSprite(exportCtx, exportCanvas.width, exportCanvas.height, scale, 0, selectedBodyColor, selectedGunColor, kind, typeId, hp, currentAim, includeBackground);

      const link = document.createElement("a");
      link.download = `${kind}-${typeId}-${scale}x.png`;
      link.href = exportCanvas.toDataURL("image/png");
      link.click();
    });

    document.getElementById("recordBtn").addEventListener("click", () => {
      const status = document.getElementById("status");
      const scale = parseInt(scaleSelect.value);
      const hp = parseFloat(hpSelect.value);
      const currentAim = parseFloat(aimRange.value);
      const kind = kindSel.value;
      const typeId = selectedTypeId();
      const includeBackground = backgroundToggle.checked;

      const recordCanvas = document.createElement("canvas");
      recordCanvas.width = 160 * scale;
      recordCanvas.height = 160 * scale;
      const recordCtx = recordCanvas.getContext("2d");

      const stream = recordCanvas.captureStream(30);
      let recorder;
      try {
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      } catch (e) {
        recorder = new MediaRecorder(stream);
      }

      let chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.download = `${kind}-${typeId}-animated-${scale}x.webm`;
        link.href = url;
        link.click();
        status.textContent = "WEBM SAVED!";
        setTimeout(() => status.textContent = "", 3000);
      };

      recorder.start();
      status.textContent = "RECORDING...";

      let speed = parseFloat(speedRange.value);
      let startTime = Date.now();

      function recordLoop() {
        gameTime += speed;
        renderSprite(recordCtx, recordCanvas.width, recordCanvas.height, scale, gameTime, selectedBodyColor, selectedGunColor, kind, typeId, hp, currentAim, includeBackground);
        if (Date.now() - startTime < 3000) {
          requestAnimationFrame(recordLoop);
        } else {
          recorder.stop();
        }
      }
      recordLoop();
    });

    renderVaultView();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
